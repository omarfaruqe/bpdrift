[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpdrift"
version = "0.0.1"
description = "Version-pinned interpretation of MIC values under EUCAST breakpoints, from the user's own breakpoint tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Md Omar Faruqe" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
