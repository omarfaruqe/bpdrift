name: release

# Builds the package, checks that it carries no breakpoint data, and publishes it
# with PyPI trusted publishing (no API token is stored anywhere).
#
#   Run manually (Actions > release > Run workflow)  -> TestPyPI
#   Publish a GitHub release                           -> PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: No breakpoint data in the package
        run: |
          python - <<'EOF'
          import sys, tarfile, zipfile, glob
          names = []
          for f in glob.glob("dist/*.tar.gz"):
              names += tarfile.open(f).getnames()
          for f in glob.glob("dist/*.whl"):
              names += zipfile.ZipFile(f).namelist()
          bad = [n for n in names if n.lower().endswith((".xlsx", ".xls", ".xlsm", ".csv"))]
          print("\n".join(sorted(names)))
          if bad:
              sys.exit(f"data files in the package: {bad}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
